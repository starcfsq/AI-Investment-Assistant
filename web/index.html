<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI 智能投资助手</title>
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <header>
    <h1>AI 智能投资助手 <span id="data-until"></span></h1>
    <div class="actions">
      <button id="btn-analyze">重新分析</button>
      <button id="btn-backtest">运行回测迭代</button>
    </div>
  </header>

  <section id="cards"></section>

  <main>
    <section class="panel">
      <h2>市场趋势</h2>
      <div id="trend"></div>
      <h2>板块排名</h2>
      <table id="sectors"></table>
      <h2>标的推荐</h2>
      <table id="stocks"></table>
      <h2>组合配置</h2>
      <div id="portfolio"></div>
    </section>

    <section class="panel">
      <h2>回测与迭代</h2>
      <div id="backtest"></div>
      <h2>投资账户</h2>
      <div id="account"></div>
      <h2>阶段历史</h2>
      <table id="periods"></table>
    </section>
  </main>

  <section class="chat">
    <div id="messages"></div>
    <div class="chat-input">
      <input id="query" placeholder="输入问题，如：宁德时代(300750)最近有什么公告？" />
      <input id="symbol" placeholder="股票代码(可选)，如 300750" style="width:150px" />
      <button id="btn-send">发送</button>
    </div>
  </section>

  <footer>本工具为数据分析演示，不构成投资建议。</footer>

  <section id="sim-section">
    <h2>一年模拟（按系统推荐方法）</h2>
    <button id="btn-sim">加载一年模拟</button>
    <canvas id="sim-chart" width="900" height="320" style="max-width:100%;border:1px solid #ddd;"></canvas>
    <div id="sim-stats" class="cards"></div>
    <h3>详细操作</h3>
    <div id="sim-trades"></div>
    <h3>调仓记录</h3>
    <div id="sim-rebalances"></div>
  </section>

  <script src="/web/app.js"></script>
</body>
</html>
